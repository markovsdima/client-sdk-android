name: Publish GitHub Packages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Maven version to publish"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./client-sdk-android
    steps:
      - name: checkout client-sdk-android
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: ./client-sdk-android
          submodules: recursive

      - name: set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: "17"
          distribution: "adopt"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Publish to GitHub Packages
        env:
          VERSION_NAME: ${{ github.event.release.tag_name || inputs.version }}
          GITHUB_PACKAGES_URL: https://maven.pkg.github.com/markovsdima/client-sdk-android
          GITHUB_PACKAGES_USERNAME: ${{ github.actor }}
          GITHUB_PACKAGES_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew --no-configuration-cache \
            :livekit-android-sdk:publishReleasePublicationToGithubPackagesRepository \
            :livekit-android-camerax:publishReleasePublicationToGithubPackagesRepository \
            :livekit-android-track-processors:publishReleasePublicationToGithubPackagesRepository \
            -PRELEASE_REPOSITORY_URL="$GITHUB_PACKAGES_URL" \
            -PSNAPSHOT_REPOSITORY_URL="$GITHUB_PACKAGES_URL" \
            -PMAVEN_REPOSITORY_NAME=githubPackages \
            -PnexusUsername="$GITHUB_PACKAGES_USERNAME" \
            -PnexusPassword="$GITHUB_PACKAGES_PASSWORD" \
            -PRELEASE_SIGNING_ENABLED=false \
            -PVERSION_NAME="$VERSION_NAME" \
            -Dorg.gradle.parallel=false
